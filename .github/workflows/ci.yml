name: Build and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows Release build and tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.424
      - name: Restore
        run: dotnet restore SonyTray.sln
      - name: Release build
        run: dotnet build SonyTray.sln -c Release --no-restore
      - name: All Windows tests
        run: dotnet test SonyTray.sln -c Release --no-build --no-restore --verbosity normal

  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: All macOS tests
        run: make -C macos test
